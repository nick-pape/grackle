syntax = "proto3";

package grackle;

import "grackle/grackle_types.proto";

service GrackleCore {
  // Environment management
  rpc ListEnvironments(Empty) returns (EnvironmentList);
  rpc AddEnvironment(AddEnvironmentRequest) returns (Environment);
  rpc RemoveEnvironment(EnvironmentId) returns (Empty);
  rpc ProvisionEnvironment(ProvisionEnvironmentRequest) returns (stream ProvisionEvent);
  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (Environment);
  rpc StopEnvironment(EnvironmentId) returns (Empty);
  rpc DestroyEnvironment(EnvironmentId) returns (Empty);

  // Agent sessions
  rpc SpawnAgent(SpawnRequest) returns (Session);
  rpc ResumeAgent(ResumeRequest) returns (Session);
  rpc SendInput(InputMessage) returns (Empty);
  rpc KillAgent(KillAgentRequest) returns (Empty);
  rpc ListSessions(SessionFilter) returns (SessionList);
  rpc GetSession(SessionId) returns (Session);
  rpc GetSessionEvents(SessionId) returns (SessionEventList);
  rpc GetTaskSessions(TaskId) returns (SessionList);

  // Runtime catalog (AHP root channel: RootState.agents)
  rpc ListRuntimes(Empty) returns (ListRuntimesResponse);

  // Streaming
  rpc StreamSession(SessionId) returns (stream SessionEvent);
  rpc StreamAll(Empty) returns (stream SessionEvent);

  // Token management
  rpc SetToken(TokenEntry) returns (Empty);
  rpc ListTokens(Empty) returns (TokenList);
  rpc DeleteToken(TokenName) returns (Empty);

  // Credential providers
  rpc GetCredentialProviders(Empty) returns (CredentialProviderConfig);
  rpc SetCredentialProvider(SetCredentialProviderRequest) returns (CredentialProviderConfig);

  // Workspaces
  rpc ListWorkspaces(ListWorkspacesRequest) returns (WorkspaceList);
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace);
  rpc GetWorkspace(WorkspaceId) returns (Workspace);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  rpc ArchiveWorkspace(WorkspaceId) returns (Empty);
  rpc LinkEnvironment(LinkEnvironmentRequest) returns (Workspace);
  rpc UnlinkEnvironment(UnlinkEnvironmentRequest) returns (Workspace);

  // Codespaces
  rpc ListCodespaces(ListCodespacesRequest) returns (CodespaceList);
  rpc CreateCodespace(CreateCodespaceRequest) returns (CreateCodespaceResponse);

  // Docker
  rpc ListDockerContainers(ListDockerContainersRequest) returns (DockerContainerList);

  // Settings
  rpc GetSetting(GetSettingRequest) returns (SettingResponse);
  rpc SetSetting(SetSettingRequest) returns (SettingResponse);

  // Pairing
  rpc GeneratePairingCode(Empty) returns (PairingCodeResponse);

  // Usage
  rpc GetUsage(GetUsageRequest) returns (UsageStats);

  // IPC
  rpc WaitForPipe(WaitForPipeRequest) returns (WaitForPipeResponse);
  rpc WriteToFd(WriteToFdRequest) returns (Empty);
  rpc CloseFd(CloseFdRequest) returns (CloseFdResponse);
  rpc GetSessionFds(SessionId) returns (SessionFds);
  rpc CreateStream(CreateStreamRequest) returns (CreateStreamResponse);
  rpc AttachStream(AttachStreamRequest) returns (AttachStreamResponse);
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse);

  // Operator stream control plane (#1309) — human-drivable streams via the
  // server (not an agent holding an fd) + the `operator:*` anchor principal.
  rpc OperatorCreateStream(OperatorCreateStreamRequest) returns (OperatorCreateStreamResponse);
  rpc OperatorAttachTask(OperatorAttachTaskRequest) returns (OperatorAttachTaskResponse);
  rpc OperatorDetachTask(OperatorDetachTaskRequest) returns (OperatorDetachTaskResponse);
  rpc ListTaskAttachments(ListTaskAttachmentsRequest) returns (ListTaskAttachmentsResponse);
  rpc OperatorCloseStream(OperatorCloseStreamRequest) returns (OperatorCloseStreamResponse);

  // Version
  rpc GetVersionStatus(Empty) returns (VersionStatus);

  // Plugins
  rpc ListPlugins(Empty) returns (PluginList);
  rpc SetPluginEnabled(SetPluginEnabledRequest) returns (PluginInfo);

  // GitHub accounts
  rpc ListGitHubAccounts(Empty) returns (GitHubAccountList);
  rpc AddGitHubAccount(AddGitHubAccountRequest) returns (GitHubAccount);
  rpc UpdateGitHubAccount(UpdateGitHubAccountRequest) returns (GitHubAccount);
  rpc RemoveGitHubAccount(RemoveGitHubAccountRequest) returns (Empty);
  rpc ImportGitHubAccounts(Empty) returns (ImportGitHubAccountsResponse);

  // Channels (capability-scoped external I/O)
  rpc ExposeChannel(ExposeChannelRequest) returns (ExposeChannelResponse);
  rpc ListChannelGrants(ListChannelGrantsRequest) returns (ChannelGrantList);
  rpc RevokeChannelGrant(RevokeChannelGrantRequest) returns (Empty);

  // Unified event streaming (replaces WebSocket)
  rpc StreamEvents(Empty) returns (stream ServerEvent);

  // Domain events (query the persisted domain_events log)
  rpc QueryDomainEvents(QueryDomainEventsRequest) returns (DomainEventList);

  // IPC stream rooms (read a durable transcript)
  rpc GetStreamTranscript(GetStreamTranscriptRequest) returns (StreamTranscript);

  // Session action log (read a session's durable, server-sequenced replay buffer)
  rpc GetSessionActions(GetSessionActionsRequest) returns (SessionActionList);

  // Resources (AHP resource bridge, #1395) — read/list files from an
  // environment's PowerLine-owned worktree, and subscribe to file-change
  // notifications. Change batches surface as "resource.changed" domain events
  // on StreamEvents (consumed by the web `useResources` domain hook).
  rpc ReadResource(ReadResourceRequest) returns (ResourceContent);
  rpc ListResource(ListResourceRequest) returns (ResourceListing);
  rpc WatchResource(WatchResourceRequest) returns (WatchHandle);
  rpc UnwatchResource(UnwatchResourceRequest) returns (Empty);
}
