name: Build and Test
description: Shared install → build → Playwright → test steps

inputs:
  skip-e2e:
    description: Skip E2E tests (Playwright install + rush e2e)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Rush build cache
      uses: actions/cache@v4
      with:
        path: common/temp/build-cache
        key: rush-build-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          rush-build-${{ runner.os }}-

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: common/temp/pnpm-store
        key: pnpm-${{ runner.os }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - name: Cache HuggingFace models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: huggingface-${{ runner.os }}-${{ hashFiles('packages/knowledge-core/package.json') }}
        restore-keys: |
          huggingface-${{ runner.os }}-

    # @vue/compiler-sfc@3.5.36 was published without its companion @vue/shared@3.5.36.
    # depcheck@1.4.7 (pulled in by npm-check inside @microsoft/rush-lib) requires
    # @vue/compiler-sfc@^3.3.4, which npm resolves to the broken 3.5.36 and then
    # fails to fetch @vue/shared@3.5.36.  Pre-install Rush with npm overrides that pin
    # @vue/compiler-sfc to 3.5.35 so install-run-rush.js skips the broken bootstrap.
    # TODO: remove once @vue/shared@3.5.36 is published to npm.
    - name: Pre-install Rush (pin @vue/compiler-sfc away from broken 3.5.36)
      shell: bash
      run: |
        RUSH_VERSION=$(node -e "const r=require('./rush.json'); process.stdout.write(r.rushVersion)")
        RUSH_DIR="common/temp/install-run/@microsoft+rush@${RUSH_VERSION}"
        mkdir -p "$RUSH_DIR"
        RUSH_VERSION="$RUSH_VERSION" RUSH_DIR="$RUSH_DIR" node -e "
          const fs=require('fs');
          const v=process.env.RUSH_VERSION, d=process.env.RUSH_DIR;
          const pkg={name:'ci-rush',version:'0.0.0',dependencies:{'@microsoft/rush':v},
            description:\"DON'T WARN\",repository:\"DON'T WARN\",license:'MIT',
            overrides:{'@vue/compiler-sfc':'3.5.35','@vue/shared':'3.5.35'}};
          fs.writeFileSync(d+'/package.json',JSON.stringify(pkg,null,2));
        "
        (cd "$RUSH_DIR" && npm install)
        node -v > "$RUSH_DIR/installed.flag"

    - name: Rush install
      shell: bash
      run: node common/scripts/install-run-rush.js install

    - name: Rush build
      shell: bash
      # Instrument the web-components Storybook build for coverage (#1384).
      # Set for ALL CI builds so the cached `storybook-static` is consistently
      # instrumented; `rush test` (below) then runs `test-storybook --coverage`.
      env:
        STORYBOOK_COVERAGE: "true"
      run: node common/scripts/install-run-rush.js build

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
      working-directory: tests/e2e-tests

    - name: Install Playwright system deps
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
      working-directory: tests/e2e-tests

    - name: Run unit tests
      shell: bash
      # STORYBOOK_COVERAGE makes the storybook-test task run `test-storybook
      # --coverage` and emit packages/web-components/coverage-storybook/lcov.info.
      env:
        STORYBOOK_COVERAGE: "true"
      run: node common/scripts/install-run-rush.js test --verbose

    - name: Run E2E tests
      if: inputs.skip-e2e != 'true'
      shell: bash
      run: node common/scripts/install-run-rush.js e2e --verbose
